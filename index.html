DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b0e11">
    
    <title>ZAEM TRADING PRO</title>
    
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    
    <style>
        :root {
            --bg: #0b0e11;
            --panel: #1e2329;
            --green: #00c087;
            --red: #f6465d;
            --accent: #fcd535;
            --text: #eaecef;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* الهيدر المحسن للتطبيق */
        header {
            background: var(--panel);
            padding: env(safe-area-inset-top) 15px 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            height: 70px;
        }

        .logo { font-weight: 800; color: var(--accent); font-size: 1.2rem; }
        .balance-container {
            background: #2b3139;
            padding: 5px 12px;
            border-radius: 6px;
            border: 1px solid #444;
        }
        #balance { font-weight: bold; color: #fff; }

        /* منطقة الرسم البياني */
        main { flex: 1; display: flex; flex-direction: column; position: relative; }
        #chart { flex: 1; width: 100%; }

        /* شريط السعر اللحظي */
        .live-bar {
            background: rgba(30, 35, 41, 0.8);
            text-align: center;
            padding: 10px;
            font-size: 22px;
            font-weight: bold;
            font-family: monospace;
            border-top: 1px solid #333;
        }

        /* لوحة التحكم السفلية (مثل تطبيقات التداول الحقيقية) */
        .controls {
            background: var(--panel);
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
        }

        .input-box {
            grid-column: span 2;
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }

        input {
            flex: 1;
            background: #2b3139;
            border: 1px solid #444;
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
        }

        .btn {
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-up { background: var(--green); box-shadow: 0 4px 0 #008f64; }
        .btn-down { background: var(--red); box-shadow: 0 4px 0 #b33243; }
        .btn:active { transform: translateY(3px); box-shadow: none; }

        /* نظام الإشعارات */
        #toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: #000;
            padding: 10px 25px;
            border-radius: 20px;
            font-weight: bold;
            z-index: 1000;
            display: none;
